# 绘图配置文件 - analyze_vi_results.py
# 修改此文件以设置各个图表的坐标轴范围
# 设置为 null 表示自动调整范围

# ==================== 通用设置 ====================
global:
  # 图表DPI分辨率
  dpi: 150
  # 图表字体大小
  fontsize: 10
  # 线宽
  linewidth: 1.5

# ==================== 时间轴设置 ====================
time_axis:
  # X轴时间范围 [min, max]，单位：秒
  # null 表示自动，或指定具体值如 [0, 10]
  xlim: null

# ==================== 1. 能量演化图 (Energy Evolution) ====================
energy:
  # X轴时间范围 [min, max]
  xlim: null
  # Y轴能量范围 [min, max]，单位：焦耳
  ylim: null
  # ylim: [-0.001, 0.001]
  # 子图例：
  # - total: 总能量线宽
  # - kinetic: 动能线宽
  # - potential: 势能线宽

# ==================== 2. 能量漂移图 (Energy Drift) ====================
delta_energy:
  # X轴时间范围 [min, max]
  xlim: null
  # Y轴能量漂移范围 [min, max]，单位：焦耳
  # ylim: null
  ylim: [-0.001, 0.001]
  # 示例: ylim: [-0.5, 0.5]

# ==================== 3. 末端执行器位置 (End-Effector Position) ====================
end_effector_position:
  # X轴时间范围 [min, max]
  xlim: null
  # Y轴位置范围 [min, max]，单位：米
  # 注意：此范围对所有轴（X/Y/Z）通用
  ylim: null
  # ylim: [-1, 1]
  # 示例: ylim: [-1.0, 1.5]

# ==================== 4. 末端执行器速度 (End-Effector Speed) ====================
end_effector_speed:
  # X轴时间范围 [min, max]
  xlim: null
  # Y轴速度范围 [min, max]，单位：米/秒
  ylim: null
  # ylim: [-0.1, 2.5]
  # 示例: ylim: [0, 5]

# ==================== 5. 关节配置 (Joint Configuration) ====================
joint_configuration:
  # X轴时间范围 [min, max]
  xlim: null
  # Y轴关节角度范围 [min, max]，单位：弧度
  ylim: null
  # ylim: [-30, 40]
  # 常用值：
  # - 圆周运动: [-3.14159, 3.14159] 或 [-π, π]
  # - 受限关节: [0, 1.57] 或 [0, π/2]
  # 示例: ylim: [-3.14159, 3.14159]

# ==================== 6. 3D轨迹图 (3D Trajectory) ====================
trajectory_3d:
  # X轴范围 [min, max]，单位：米
  xlim: null
  # Y轴范围 [min, max]，单位：米
  ylim: null
  # Z轴范围 [min, max]，单位：米
  zlim: null
  # 示例：
  # xlim: [-0.5, 0.5]
  # ylim: [-0.5, 0.5]
  # zlim: [0, 2]

# ==================== 7. 动량 (Momentum) - 可选 ====================
momentum:
  # X轴时间范围 [min, max]
  xlim: null
  # Y轴动量范围 [min, max]，单位：kg·m/s
  ylim: null

# ==================== 注意事项 ====================
# 1. 所有范围值使用 [最小值, 最大值] 的列表格式
# 2. 使用 null 表示自动调整（根据数据自动设置范围）
# 3. 数值范围应该是合理的，坐标轴会自动扩展5%的边距
# 4. 如果只想设置一个轴的范围，另一个设为 null
# ==================== 常用πr值参考 ====================
# π ≈ 3.14159
# π/2 ≈ 1.5708
# π/4 ≈ 0.7854
# 2π ≈ 6.28318
